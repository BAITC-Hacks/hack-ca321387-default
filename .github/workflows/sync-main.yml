name: Sync main to team branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge main into ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [arys, damir]
    concurrency:
      group: sync-main-${{ matrix.branch }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge and push
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git switch -C "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          if ! git merge --no-edit origin/main; then
            echo "::error::Merge conflict in ${TARGET_BRANCH}. Resolve it manually; no changes were pushed."
            exit 1
          fi

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
