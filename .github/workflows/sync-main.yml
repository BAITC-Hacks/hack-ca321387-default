name: Sync main to team branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - damir
          - arys

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin

      - name: Sync main into ${{ matrix.branch }}
        run: |
          git checkout -B "${{ matrix.branch }}" "origin/${{ matrix.branch }}"
          git merge origin/main --no-edit
          git push origin HEAD:${{ matrix.branch }}
